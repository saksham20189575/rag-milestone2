name: Daily corpus ingest

on:
  schedule:
    # 10:00 AM IST (UTC+5:30) = 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: daily-ingest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  CHROMA_PERSIST_DIR: data/index
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run daily ingest
        run: python scripts/ingest.py --scheme all --refresh

      - name: Verify ingest output
        run: python scripts/verify_ingest.py

      - name: Run retrieval smoke tests
        run: pytest tests/test_retrieval.py -k "expense_ratio or retriever_manual" -q

      - name: Commit refreshed corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/index/
          if git diff --staged --quiet; then
            echo "No corpus changes to commit."
          else
            git commit -m "chore(ingest): daily corpus refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report ingest failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily corpus ingest failed";
            const body = [
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "The scheduled Groww scrape / normalize / chunk / embed / Chroma update did not complete successfully.",
              "Re-run manually via Actions → Daily corpus ingest → Run workflow.",
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ingest-failure",
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ingest-failure"],
            });
